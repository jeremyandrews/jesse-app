name: CI

# THIS WORKFLOW IS LINUX-ONLY, AND IT IS THE GATE ON EVERY PR.
#
# The Swift/macOS half of CI is NOT here — it lives in ios-ci.yml, which runs
# nightly against main plus manual dispatch, and skips itself when no
# iOS-relevant path changed. It was moved out because GitHub's hosted macOS
# runners bill at 10x the Linux rate and that one job was essentially all of
# this repo's Actions spend: it booted three simulators and ran four
# uncached builds on every PR and every push to main.
#
# The pre-merge check for the app is therefore LOCAL, not hosted:
# `scripts/local-ci-macos.sh` runs the same checks on your own Mac, and the
# pre-push hook (`scripts/install-hooks.sh`) runs it for you and blocks the
# push if it fails. The nightly is the backstop that catches what a bypassed
# hook let through — it is not the gate. See README → Development.
#
# One CI run per ref. On PR branches a new push cancels the superseded run;
# runs on main are never cancelled, so every merge commit keeps a complete CI
# record. Restricting `push` to main stops the duplicate push+pull_request
# runs PR branches used to get.

on:
  push:
    branches: [main]
  pull_request:
  # A manual run, for the coverage job (which otherwise runs only on pushes to main).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # THE ROOT WORKSPACE'S `agent/` CRATE. A separate job from `bridge` on purpose: the
  # bridge is EXCLUDED from the root workspace (see the root Cargo.toml) and builds from
  # `working-directory: bridge` with its own Cargo.lock, so one `cargo` invocation cannot
  # cover both and nothing here changes how the bridge is built.
  #
  # SCOPED TO `-p jesse-agent`, NOT THE WHOLE WORKSPACE. The other member, `eval/`, has its
  # own job below: the two crates fail for different reasons and a combined job would make
  # "CI is red" stop telling you which one. Nothing about the bridge changes either way.
  agent:
    name: agent (build, test, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup component add clippy rustfmt

      # Saved by runs on main only; see the bridge jobs' cache step.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: agent
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `--locked` for the same reason it is on the bridge's release build: the lock must be
      # the one that ships, not one CI quietly regenerated. See that step's comment.
      - name: Build
        run: cargo build -p jesse-agent --locked

      # `--all-targets` so the conformance suite AND `examples/smoke.rs` are compiled. The
      # smoke is an example rather than a test precisely so this compiles it and never
      # RUNS it: it needs a live endpoint and a credential, neither of which belongs in CI.
      - name: Test
        run: cargo test -p jesse-agent --all-targets

      - name: Clippy
        run: cargo clippy -p jesse-agent --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt -p jesse-agent --check

      # THE ROOT LOCKFILE'S CVE GATE. `Cargo.lock` at the repository root covers both
      # `agent/` and `eval/`, and until this step nothing audited it: the bridge job audits
      # `bridge/Cargo.lock` only, and audit.yml runs that same bridge audit weekly. It lives
      # in this job because the agent is where reqwest/rustls enter the root graph. Same
      # prebuilt binary and the same bare `cargo audit` as the bridge job: a vulnerability
      # fails the step, an informational warning (unsound, unmaintained) is reported and
      # does not. There is no root ignore list; see `bridge/.cargo/audit.toml` for what an
      # audited exception has to say before one is added.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Dependency CVE audit (root lockfile)
        run: cargo audit

  # THE EVAL HARNESS. New in D7, and it joins CI at the same time as the `product-v1`
  # suite it validates: the teeth check (good mock scores every task, known-bad mock scores
  # none, on BOTH drivers) lives in `eval/tests/integration.rs` and is worth nothing unless
  # something runs it on every PR. Until this job existed, `vaultqa-example`'s equivalent
  # check had been green locally and unrun in CI.
  #
  # `--all-targets` so `tests/integration.rs` is compiled and run; it drives the real
  # binary with `--mock`, so there is no network and no model in any of it.
  eval:
    name: eval (build, test, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup component add clippy rustfmt

      # Saved by runs on main only; see the bridge jobs' cache step.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: eval
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `--locked`, as on the other two builds — see the bridge's release step.
      - name: Build
        run: cargo build -p jesse-eval --locked

      # This is the teeth check. `product_v1_{direct,cli}_{good,bad}_mock_*` are four of the
      # tests it runs, and between them they are the claim that the suite's assertions catch
      # exactly the defects they name — on both drivers.
      - name: Test
        run: cargo test -p jesse-eval --all-targets

      - name: Clippy
        run: cargo clippy -p jesse-eval --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt -p jesse-eval --check

  # THE BRIDGE, AS FOUR JOBS THAT RUN AT ONCE. Until QT1 this was one `bridge` job whose steps
  # ran one after another (release build, both test builds, both clippy runs, coverage), so
  # every pull request waited for the sum of them: 25 minutes. The commands, their flags and the
  # pinned toolchain are unchanged; only the grouping is new, and each job keeps its own cache
  # so the release, test, lint and instrumented profiles stop evicting each other.
  #
  # Every job here keeps `bridge` as the first word of its name: the sentinel's deploy gate
  # (`src/sentinel/deploy.rs`, `job_matches`) accepts a green run that carries a green job
  # named `bridge` or `bridge (...)`.
  #
  # The test budgets and the slow test allowlist that keep this fast are in docs/testing.md.

  # (a) THE SERVING BINARY, THE DEPENDENCY AUDIT AND THE SOURCE GUARDS.
  bridge-build:
    name: bridge (release build, audit, guards)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      # Full history, NOT the default depth-1: scripts/version-guard.sh derives its
      # diff base from the merge base with origin/main, and at depth 1 there is no
      # history to derive it from. That is not a hypothetical — the guard silently
      # skipped every CI run it was ever part of, logging "no diff base" and passing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PINNED, not the runner image's stable. The clippy that gates a merge used to be
      # whatever stable `ubuntu-latest` happened to carry, so the gate changed under the
      # repository without a commit: Clippy 1.100 reported `needless_range_loop` on loops
      # nobody had touched, and `main` would have gone red the day the image moved. The
      # gate must not change without a commit. Moving to a newer Rust is a deliberate pull
      # request that bumps this version AND fixes the new lints in the same change. The
      # version is printed so every run's log names the toolchain it was judged by.
      # SCOPE: the four bridge jobs, each installing the same version with this same step;
      # `agent` and `eval` still use the image's stable.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup default 1.100.0
          rustc --version
          cargo clippy --version

      # One cache per job (`shared-key`), so the release profile is never evicted by the test
      # or lint profile. Saved only by runs on main; a pull request restores main's and never
      # writes its own, so a branch cannot crowd main's entries out of the repository's quota.
      # `build.rs` stamps the commit into the binary and asks `git status` whether the tree is
      # dirty, which REWRITES a freshly checked out index; it also tells cargo to rerun when the
      # index changes. So the first cargo command changed the index under itself and every later
      # one rebuilt the whole crate (100 s of the first `Test` step). Refreshing the index once,
      # before any build, leaves `git status` nothing to write.
      - name: Refresh the git index
        run: git update-index -q --refresh || true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
          shared-key: bridge-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The SERVING binary, built exactly as a deploy builds it: without
      # `containment-probe`. The probe prompts, the battery runner and its loopback
      # listener are not compiled into the bridge that answers turns, and this step is
      # what keeps that true — if the probe module ever leaks onto the always-compiled
      # path, this build is where it shows up.
      # `--locked` IS LOAD-BEARING, and it is here because its absence cost a deploy.
      #
      # The deploy builds with `cargo build --release --locked`; CI built without it. So a
      # commit whose `Cargo.lock` disagreed with its `Cargo.toml` — a version bumped in one
      # and not the other — went green here, merged, and then failed at the deploy's build
      # step with "cannot update the lock file ... because --locked was passed". The only
      # thing in the system that could catch it was the last thing to run.
      #
      # A CI build that silently REPAIRS the lock is not testing what ships. This makes the
      # two builds ask the same question.
      - name: Build (release)
        run: cargo build --release --locked

      # Prebuilt binary (no from-source compile): the dependency-CVE gate.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails the build on a known-vulnerable dependency (reqwest/ring/rustls are
      # in the graph). Currently clean — no advisories, no ignore list. If an
      # unpatchable transitive advisory ever surfaces, add it to an audited ignore
      # list (`cargo audit --ignore RUSTSEC-YYYY-NNNN`, or a `deny.toml`
      # `[advisories] ignore` block) with a note on why it isn't reachable here —
      # never silently pin to a vulnerable version.
      # A weekly scheduled run (audit.yml) covers advisories that land between
      # pushes.
      - name: Dependency CVE audit
        run: cargo audit

      - name: Install gitleaks
        working-directory: ${{ github.workspace }}
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Source guards (incl. R5 personal-infra + gitleaks)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-guards.sh

  # (b) THE TESTS, WITH THE FEATURE ON, UNDER CARGO-NEXTEST.
  bridge-test:
    name: bridge (test, containment-probe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    # THE HEALTH ARCHIVE'S DATABASE TESTS (`tests/it/healthdb_pg.rs`). They run only when
    # JESSE_TEST_PG_URL is set, and each creates and drops its own database on this throwaway
    # server, so concurrent test processes never see each other's rows. Nothing else in the
    # job touches it, and the build itself needs no database: every query is a runtime
    # `sqlx::query`. The coverage job below has its own server, for the same tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JESSE_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      # THE WALL CLOCK BUDGET for the `Test` step below (test execution only; the build is its
      # own step). Measured at 62 s on this runner (PR #354), plus 50 percent; see docs/testing.md
      # before raising it.
      TEST_BUDGET_SECS: 93
    steps:
      - uses: actions/checkout@v7

      # Pinned: see the toolchain step in `bridge-build`.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup default 1.100.0
          rustc --version
          cargo clippy --version

      # Its own cache: see `bridge-build`.
      # `build.rs` stamps the commit into the binary and asks `git status` whether the tree is
      # dirty, which REWRITES a freshly checked out index; it also tells cargo to rerun when the
      # index changes. So the first cargo command changed the index under itself and every later
      # one rebuilt the whole crate (100 s of the first `Test` step). Refreshing the index once,
      # before any build, leaves `git status` nothing to write.
      - name: Refresh the git index
        run: git update-index -q --refresh || true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
          shared-key: bridge-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Prebuilt binary. nextest runs every test in its own process, all of them at once, so
      # the suite takes as long as its slowest tests rather than the sum of its test binaries.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The build, on its own so the `Test` step's time (and its budget) is the tests alone.
      - name: Build tests
        run: cargo nextest run --features containment-probe --profile ci --no-run

      # Tests and lints DO enable the feature, so the probe module and the containment
      # record's consistency checks (tests/it/containment.rs, which requires the feature to
      # read the probe table) are gated on every merge. The live battery inside that file
      # stays `#[ignore]`d — it spawns real agent turns.
      - name: Test
        run: |
          start=$(date +%s)
          cargo nextest run --features containment-probe --profile ci
          took=$(( $(date +%s) - start ))
          echo "Test took ${took}s against a budget of ${TEST_BUDGET_SECS}s."
          if [ "$took" -gt "$TEST_BUDGET_SECS" ]; then
            echo "::error title=Test wall clock budget exceeded::The tests took ${took}s; the budget is ${TEST_BUDGET_SECS}s. Find what got slower in the slow test report (target/nextest/ci/junit.xml, uploaded as an artifact) and see docs/testing.md, 'When the budget trips'."
            exit 1
          fi

      # nextest does not run doc tests, and `cargo test --features containment-probe` did.
      - name: Doc tests
        run: cargo test --doc --features containment-probe

      # Any test over 10 s that is not on bridge/.config/slow-tests.txt fails the job.
      - name: Slow test check
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-guards.sh --slow-tests bridge/target/nextest/ci/junit.xml

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-bridge-test
          path: bridge/target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # (c) THE DEFAULT FEATURE SET, BOTH CLIPPY RUNS AND FORMATTING.
  bridge-lint:
    name: bridge (default-feature test, clippy, fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    env:
      # THE WALL CLOCK BUDGET for `Test (default features)`: measured at 18 s (PR #354), plus 50
      # percent; see `bridge-test` and docs/testing.md.
      TEST_BUDGET_SECS: 27
    steps:
      - uses: actions/checkout@v7

      # Pinned: see the toolchain step in `bridge-build`.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup default 1.100.0
          rustc --version
          cargo clippy --version

      # Its own cache: see `bridge-build`.
      # `build.rs` stamps the commit into the binary and asks `git status` whether the tree is
      # dirty, which REWRITES a freshly checked out index; it also tells cargo to rerun when the
      # index changes. So the first cargo command changed the index under itself and every later
      # one rebuilt the whole crate (100 s of the first `Test` step). Refreshing the index once,
      # before any build, leaves `git status` nothing to write.
      - name: Refresh the git index
        run: git update-index -q --refresh || true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
          shared-key: bridge-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build tests (default features)
        run: cargo nextest run --lib --profile ci --no-run

      # The library tests AGAIN, on the default feature set. Every other test build here
      # enables the feature, so a test that reached a feature gated item compiled green
      # under it and broke every default test build (0.145.0 to 0.147.0), with nothing
      # reporting it. This is the build a developer gets from a bare `cargo test --lib`.
      - name: Test (default features)
        run: |
          start=$(date +%s)
          cargo nextest run --lib --profile ci
          took=$(( $(date +%s) - start ))
          echo "Test (default features) took ${took}s against a budget of ${TEST_BUDGET_SECS}s."
          if [ "$took" -gt "$TEST_BUDGET_SECS" ]; then
            echo "::error title=Test wall clock budget exceeded::The default feature tests took ${took}s; the budget is ${TEST_BUDGET_SECS}s. See docs/testing.md, 'When the budget trips'."
            exit 1
          fi

      - name: Slow test check (default features)
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-guards.sh --slow-tests bridge/target/nextest/ci/junit.xml

      - name: Clippy
        run: cargo clippy --all-targets --features containment-probe -- -D warnings

      # Clippy AGAIN, on the default feature set, for the same reason as the default
      # features test above. A lint that exists only without the feature is invisible to
      # the feature build: `row()` in mcpservers.rs once had an `or_else` closure that
      # compiled to `|| None` without `containment-probe`, and nothing here reported it.
      # This is the build a developer gets from a bare `cargo clippy`, which they run first.
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      # Formatting is enforced, not merely conventional. It sits AFTER build/test/clippy
      # for the same reason clippy sits after test: steps stop at the first failure, and a
      # reflowed line is the least useful thing to learn at the cost of not learning
      # whether the tests passed.
      #
      # This gate exists because the crate had drifted out of `cargo fmt` shape entirely
      # (41 files across both crates, reformatted in bf8225f). The cost of that drift was
      # paid by every unrelated PR, which had to choose between carrying reformat noise
      # through files it never touched or hand-reverting rustfmt after each run. Neither
      # is reviewable, so the drift is now a build failure instead of a judgement call.
      #
      # SCOPE: the bridge only. This job's `working-directory: bridge` means this step
      # cannot see the root workspace — `bridge/` is deliberately excluded from it (see the
      # root Cargo.toml), so one `cargo fmt` never covers both. The root workspace's two
      # members enforce their own formatting in the `agent` and `eval` jobs above.
      - name: Format check
        run: cargo fmt --all --check

  # (d) COVERAGE, OFF THE GATE PATH. Report-only, non-gating: emit a coverage number so a
  # floor can be chosen later. It rebuilds the crate instrumented and reruns every test, which
  # cost every pull request seven minutes for a number nobody gates on, so it runs only on
  # pushes to main (and a manual dispatch of this workflow).
  bridge-coverage:
    name: bridge (coverage, report-only)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    # The same throwaway server as `bridge-test`, for the same database tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JESSE_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      # Pinned: see the toolchain step in `bridge-build`.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup default 1.100.0
          rustc --version
          cargo clippy --version

      # Its own cache: see `bridge-build`.
      # `build.rs` stamps the commit into the binary and asks `git status` whether the tree is
      # dirty, which REWRITES a freshly checked out index; it also tells cargo to rerun when the
      # index changes. So the first cargo command changed the index under itself and every later
      # one rebuilt the whole crate (100 s of the first `Test` step). Refreshing the index once,
      # before any build, leaves `git status` nothing to write.
      - name: Refresh the git index
        run: git update-index -q --refresh || true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
          shared-key: bridge-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Prebuilt binaries (no from-source compile): the coverage tool and the runner it drives.
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # Under nextest every test is its own process, so the fake-`claude` subprocess tests no
      # longer share one and the `--test-threads=1` this step used to need is gone.
      # continue-on-error so a coverage hiccup never fails main.
      - name: Coverage (report-only)
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "### bridge coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov nextest --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The iOS deployment-target rule, guarded on Linux so it is checked on EVERY
  # push rather than only when someone runs the Mac gate. The rule (build at the
  # shipped target, lowered only to fit an older simulator) is one line of version
  # arithmetic shared by scripts/local-ci-macos.sh and ios-ci.yml, and its two
  # failure modes are silent: compare as strings and 26.10 sorts below 26.5; take
  # the max and every SDK deprecation becomes a build error the product never
  # sees. Neither shows up until a gate fails on code nobody touched.
  ios-deployment-target:
    name: iOS deployment target rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Helper unit tests
        run: bash scripts/test-ios-deployment-target.sh

      # The simulator rule both Mac gates share (scripts/simulator-pick.jq): which
      # runtime and iPhone they test on. A wrong pick still builds and runs, on a
      # model nobody chose; an iPhone Duo listed last turned 38 UI tests red.
      - name: Simulator pick rule
        run: bash scripts/test-simulator-pick.sh

      # The local gate's step plumbing (scripts/lib/ci-runner.sh): every step runs,
      # a step runs only when the steps it needs passed, and the final line names
      # every failure. Stub steps, no Xcode, so it is checked here on every push.
      - name: Local gate runner
        run: bash scripts/test-ci-runner.sh

      # The window trap: a test builds an AppKit window only through makeTestWindow,
      # which sets isReleasedWhenClosed = false. Source text only, so Linux can check
      # it on every push; the local gate runs it too.
      - name: Swift test guards
        run: bash scripts/swift-test-guards.sh
