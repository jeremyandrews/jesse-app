# cargo-audit's configuration for the bridge, read by `cargo audit` in this directory (the CI
# gate in ci.yml and the weekly run in audit.yml alike).
#
# Every entry here is an AUDITED exception: an advisory against a crate that appears in
# Cargo.lock but is not compiled into anything this crate builds. Each one names how that was
# checked. Never add an entry for a crate that `cargo tree` can reach.

[advisories]
ignore = [
    # RUSTSEC-2023-0071, `rsa` (Marvin attack; no fixed release exists). It is in Cargo.lock
    # only because sqlx's MySQL driver depends on it, and Cargo records optional weak
    # dependencies (`sqlx-mysql?/…` in sqlx's feature table) in the lockfile even when they
    # are never enabled (rust-lang/cargo#10801). The bridge enables sqlx's `postgres` driver
    # only, so neither `sqlx-mysql` nor `rsa` is built: `cargo tree -i rsa --target all` and
    # `cargo tree -i sqlx-mysql --target all` both print nothing. Revisit if a MySQL feature
    # is ever enabled, or when sqlx stops pulling the crate into the lock.
    "RUSTSEC-2023-0071",
]
