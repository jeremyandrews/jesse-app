# THE CAPABILITY MAP: one row per grant in `DEFAULT_ALLOWED_TOOLS` (bridge/src/config.rs),
# keyed by the exact grant string. It records what each grant is, which harnesses it reaches
# today, and where the capability lives once the bridge leaves the Mac. Nothing here changes
# what a turn may do: the allowlist is the boundary and this file only describes it.
#
# `capmap::tests` fails the build when a grant has no row, a row names no grant, a row's
# `kind` or `server` disagrees with its grant string, or a row's `harnesses` disagrees with
# what the code actually hands each harness. Adding or removing a grant therefore means
# adding or removing its row here in the same change.
#
# FIELDS
#   kind        file | bash | skill | web | mcp
#   server      the MCP server, for mcp grants only
#   harnesses   the harnesses the grant string reaches today, derived from the code:
#                 * claude-code takes the whole allowlist as `--allowedTools`;
#                 * codex takes only the `mcp__<server>__<tool>` entries, as each server's
#                   `enabled_tools` (its shell and file edits are an OS sandbox, not grants);
#                 * direct takes MCP tools only from a deployment's `[[direct.mcp]]` table
#                   (stdio servers only), and the shipped posture and the Studio grant none.
#               The full set reaches a main turn at the write level only: a read-level turn
#               gets `READ_ALLOWED_TOOLS` (or `REPLIES_ALLOWED_TOOLS` for the brief child).
#               An mcp row that does not list all three is a PARITY DEFECT, recorded as it
#               is today rather than hidden; it is not a placement.
#   placement   where the capability lives after the move:
#                 turn-pod      inside the agent's own pod, no credential
#                 core          the bridge does it with its own credentials
#                 upstream-pod  an MCP server in its own pod with only its own secret
#                 mac-edge      needs macOS, served by the Mac service
#                 drop          remove
#   dependency  credential variable NAMES (never values), LAN targets or macOS features,
#               taken from the three Codex tables in harness/codex.rs and from each server's
#               launcher or env file
#   workflows   the skills, scheduled jobs and routines that use it (free text)
#   reason      one sentence
#   note        optional
#
# Bash and Skill grants appear in the turn trace only as the bare class names `Bash` and
# `Skill`, so the usage audit reports them as two class rows and never as "never used".
# See `tool-usage` in bridge/README.md.

[grant."Read(//${WORKSPACE}/**)"]
kind = "file"
harnesses = ["claude-code"]
placement = "turn-pod"
dependency = "none (the vault checkout the pod is given)"
workflows = "every main turn; diet-logging, archive-processing, strand-update, drafts and research writes"
reason = "Reads vault files, scoped to the turn's own working directory."

[grant."Edit(//${WORKSPACE}/**)"]
kind = "file"
