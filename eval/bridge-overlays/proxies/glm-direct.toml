# K04: the `glm-direct` cell with the tool gateway, the MODEL proxy and the EGRESS proxy ON.
# Generated from `../gateway/glm-direct.toml` (copied below with the one change marked K04, its
# `socket_dir` made distinct) plus the [proxy] table. The phone tier is left at its default,
# `open-logged`: this is the parity run against the gateway run. See README.md.
#
# Ports 18057/18058 are this cell's own, so no two cells (and never the live bridge on
# 8767/8768) share a listener. Run one bridge per overlay at a time.

# Arms `glm-direct` for a jesse-eval bridge run: GLM on Fireworks, on the DIRECT harness (the
# bridge's in-process agent loop) over the OpenAI chat wire. The deployment has no such
# entry, because its `glm` runs on claude-code; this one exists so the baseline has a
# Fireworks cell on `direct`. Same key as `glm`: pass `--pass-env JESSE_MODEL_GLM_AUTH_TOKEN`.
#
# `base_url` is the API ROOT the chat wire appends `/chat/completions` to.
[[models]]
id = "glm-direct"
family = "GLM"
version = "5.3 (direct)"
kind = "hosted"
harness = "direct"
wire = "chat"
base_url = "https://api.fireworks.ai/inference/v1"
model = "accounts/fireworks/models/glm-5p3"
auth_token_env = "JESSE_MODEL_GLM_AUTH_TOKEN"
# K04: `cache_write_per_m` added. The model proxy refuses to forward a METERED call for a
# model whose deck lacks any of the four rates (`unpriced_model`), and this entry had three.
# 1.40 is the built-in `glm` entry's convention: Fireworks bills no separate cache write, so
# the write rate IS the input rate.
price = { in_per_m = 1.40, cached_per_m = 0.26, cache_write_per_m = 1.40, out_per_m = 4.40 }
health = { timeout_secs = 15 }

[gateway]
enabled = true
socket_dir = "/tmp/jgw-px-glm-direct"

# A direct turn reaches iMCP as `jesse-agent`, a client name the iMCP app has not been
# asked to trust, and the app answers a new name with an on-screen approval prompt. An
# unattended eval must not raise one, so iMCP is pointed at a closed port for these cells:
# its two tools are absent, and no workflows-v1 task uses them.
[mcp.imcp]
transport = "http"
url = "http://127.0.0.1:9/mcp"

[proxy]
model = true
egress = true
model_listen = "127.0.0.1:18057"
egress_listen = "127.0.0.1:18058"
