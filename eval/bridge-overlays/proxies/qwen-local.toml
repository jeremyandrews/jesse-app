# K04: the `qwen-local` cell with the tool gateway, the MODEL proxy and the EGRESS proxy ON.
# Generated from `../gateway/qwen-local.toml` (copied below unchanged, its
# `socket_dir` made distinct) plus the [proxy] table. The phone tier is left at its default,
# `open-logged`: this is the parity run against the gateway run. See README.md.
#
# Ports 18037/18038 are this cell's own, so no two cells (and never the live bridge on
# 8767/8768) share a listener. Run one bridge per overlay at a time.

# Arms `qwen-local` for a jesse-eval bridge run: a local model on the claude-code harness,
# reached through the Anthropic-surface gateway on 127.0.0.1:9100 (alias `local-qwen`).
# Mirrors the deployment's entry of the same id. Pass the gateway token through with
# `--pass-env JESSE_MODEL_QWEN_LOCAL_TOKEN`.
[[models]]
id = "qwen-local"
family = "Qwen"
version = "3.8 Flash-Next (local)"
kind = "local"
base_url = "http://127.0.0.1:9100"
model = "local-qwen"
auth_token_env = "JESSE_MODEL_QWEN_LOCAL_TOKEN"
health = { timeout_secs = 15 }

[gateway]
enabled = true
socket_dir = "/tmp/jgw-px-qwen-local"

[proxy]
model = true
egress = true
model_listen = "127.0.0.1:18037"
egress_listen = "127.0.0.1:18038"
